<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="initializeGallery()">

  
    <div id="image-preview">
        Hãy di chuột hoặc dùng phím Tab để chọn ảnh bên dưới.
    </div>

   
    <div class="gallery">
        
        <img class="preview" 
             src="img/1.png" 
             alt="Mô tả ảnh 1 ngắn gọn" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()"
             onfocus="upDate(this)" 
             onblur="unDo()">

        <img class="preview" src="img/2.jpg" alt="Mô tả ảnh 2" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="img/3.jpg" alt="Mô tả ảnh 3" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="img/4.jpg" alt="Mô tả ảnh 4" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="img/5.jpg" alt="Mô tả ảnh 5" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        <img class="preview" src="img/6.jpg" alt="Mô tả ảnh 6" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>

    <script src="main.js"></script>
</body>
</html>
